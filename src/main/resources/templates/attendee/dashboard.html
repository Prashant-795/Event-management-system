<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('My Dashboard')}"></head>
<body>
<div th:replace="~{fragments :: nav}"></div>
<div class="container">
  <div th:replace="~{fragments :: flash}"></div>
  <h1>Hello, <span th:text="${user.name}">there</span></h1>
  <p class="sub">Your upcoming events and activity.</p>

  <div class="grid cols-3">
    <div class="card stat"><div class="n" th:text="${#lists.size(upcoming)}">0</div><div class="l">Upcoming events</div></div>
    <div class="card stat"><div class="n" th:text="${ticketCount}">0</div><div class="l">Tickets purchased</div></div>
    <div class="card stat"><div class="n" th:text="${historyCount}">0</div><div class="l">Total registrations</div></div>
  </div>

  <div class="card">
    <h2>Upcoming events</h2>
    <div class="empty" th:if="${#lists.isEmpty(upcoming)}">
      You are not registered for any upcoming events. <a th:href="@{/}">Browse events</a>
    </div>
    <table th:if="${!#lists.isEmpty(upcoming)}">
      <thead><tr><th>Event</th><th>Date</th><th>Venue</th></tr></thead>
      <tbody>
        <tr th:each="r : ${upcoming}">
          <td><a th:href="@{/events/{id}(id=${r.event.id})}" th:text="${r.event.title}"></a></td>
          <td th:text="${#temporals.format(r.event.eventDate,'EEE, dd MMM yyyy, HH:mm')}"></td>
          <td th:text="${r.event.venue}"></td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
