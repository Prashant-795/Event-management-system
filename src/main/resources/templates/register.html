<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Sign up')}"></head>
<body>
<div th:replace="~{fragments :: nav}"></div>
<div class="container">
  <div class="card form-narrow">
    <h1>Create your account</h1>
    <p class="sub">Join as an attendee or as an event organizer.</p>
    <div class="alert error" th:if="${!open}">New registrations are currently closed by the administrator.</div>
    <div class="alert error" th:if="${#fields.hasGlobalErrors()}" th:each="err : ${#fields.globalErrors()}" th:text="${err}"></div>
    <form th:action="@{/register}" th:object="${form}" method="post">
      <label for="name">Full name</label>
      <input id="name" type="text" th:field="*{name}">
      <div class="err" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>

      <label for="email">Email</label>
      <input id="email" type="email" th:field="*{email}">
      <div class="err" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>

      <label for="password">Password</label>
      <input id="password" type="password" th:field="*{password}">
      <div class="err" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>

      <label for="role">I want to</label>
      <select id="role" th:field="*{role}">
        <option value="ATTENDEE">Attend events</option>
        <option value="ORGANIZER">Organise events</option>
      </select>
      <p><button class="btn" type="submit">Sign up</button></p>
    </form>
    <p class="meta">Already registered? <a th:href="@{/login}">Login</a></p>
  </div>
</div>
<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
