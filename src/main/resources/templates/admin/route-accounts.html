<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Razorpay Route accounts')}"></head><body><div th:replace="~{fragments :: nav}"></div><div class="container"><div th:replace="~{fragments :: flash}"></div><div class="card"><h1>Razorpay Route accounts</h1><p>Approve an account only after checking the linked account and organizer onboarding directly in the Razorpay dashboard.</p><table><thead><tr><th>Organizer</th><th>Email</th><th>Linked account ID</th><th>Status</th><th>Action</th></tr></thead><tbody><tr th:each="u : ${organizers}"><td th:text="${u.name}"></td><td th:text="${u.email}"></td><td th:text="${u.razorpayRouteAccountId == null ? 'Not supplied' : u.razorpayRouteAccountId}"></td><td th:text="${u.razorpayRouteApproved ? 'Approved' : 'Pending'}"></td><td><form th:if="${u.razorpayRouteAccountId != null and !u.razorpayRouteAccountId.isBlank() and !u.razorpayRouteApproved}" th:action="@{/admin/route-accounts/{id}/approve(id=${u.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/><button class="btn sm" type="submit">Approve</button></form><form th:if="${u.razorpayRouteApproved}" th:action="@{/admin/route-accounts/{id}/reject(id=${u.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/><button class="btn sm bad" type="submit">Revoke</button></form></td></tr></tbody></table></div></div><div th:replace="~{fragments :: footer}"></div></body></html>
