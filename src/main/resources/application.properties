server.port=8080
spring.application.name=event-management-system

# H2 file database (data survives restarts). Stored in ./data/
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/eventdb;AUTO_SERVER=TRUE}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=true
spring.jpa.show-sql=false

# --- MySQL alternative (also uncomment the dependency in pom.xml) ---
# spring.datasource.url=jdbc:mysql://localhost:3306/eventdb?createDatabaseIfNotExist=true
# spring.datasource.username=root
# spring.datasource.password=${DATABASE_PASSWORD:}yourpassword
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.thymeleaf.cache=false

# Razorpay: set these in your local environment / hosting dashboard; never commit live secrets.
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
razorpay.route-enabled=${RAZORPAY_ROUTE_ENABLED:false}
payments.expiry-check-ms=${PAYMENTS_EXPIRY_CHECK_MS:60000}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
